const storage = {
  get: async (key) => {
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return { key, value };
  },
  delete: async (key) => {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
};

    passage: `When a statement is repeated often enough, our brains begin to treat it as more credible — even when we know it is false. This phenomenon, called the illusory truth effect, was first documented by psychologist Lynn Hasher and her colleagues in 1977. In their study, participants were presented with the same trivia statements multiple times across several weeks. Statements that appeared more than once were rated as more likely to be true, regardless of their actual accuracy.

The effect persists for a striking reason: repetition feels like fluency, and fluency feels like truth. Our cognitive system uses ease of processing as a quick proxy for reliability. When information flows smoothly through our minds, we mistake that smoothness for credibility. Importantly, this happens even when participants are explicitly told beforehand that some statements are false.

Recent studies have extended these findings to political misinformation, advertising, and social media. A 2015 study at Vanderbilt University found that even implausible claims, such as "the Atlantic Ocean is the largest ocean on Earth," became more believable after just one prior exposure. The effect is robust across age groups and education levels, suggesting it operates below conscious awareness.

What makes the illusory truth effect particularly troubling is its resistance to correction. Even after a falsehood is officially debunked, mere familiarity with the original claim can leave a lingering sense that it might still be true. This poses a serious challenge for fact-checkers and educators alike, who must compete not just with new lies but with the residual feeling of truth that repetition creates.

Understanding this bias is the first step, but knowing about it does not make us immune. Researchers are now exploring whether specific cognitive strategies — such as actively questioning fluent claims or pausing before accepting information — can reduce vulnerability to repeated misinformation.`,

    source: "Scientific American",
    passage: `For decades, sleep was thought to be a passive state — a kind of biological idle mode. Modern neuroscience has dramatically revised this view. We now know that during sleep, particularly during slow-wave sleep and REM stages, the brain is intensely active in consolidating memories formed during waking hours.

The process works roughly as follows. As we encounter new experiences during the day, the hippocampus — a small, seahorse-shaped structure deep in the brain — temporarily records these events. But the hippocampus has limited capacity, and storing memories there is metabolically expensive. During sleep, the brain replays these recent experiences and gradually transfers them to the neocortex, where they can be stored more permanently and integrated with existing knowledge.

This consolidation is not merely about preservation. Sleep also seems to extract patterns and meaning from individual experiences. Studies have shown that participants who sleep after learning a new skill perform better not only at the specific task they practiced, but also at related tasks they never explicitly trained on. The brain, it appears, abstracts general rules from specific examples while we are unconscious.

    topic: "壓力與大腦",
    title: "How Chronic Stress Reshapes the Brain",
    source: "APA Monitor",
    passage: `Acute stress — the kind that surges through us before a job interview or while narrowly avoiding a car accident — is generally adaptive. The body floods with cortisol and adrenaline, sharpening attention and mobilizing resources. Once the threat passes, these chemicals subside and the body returns to baseline. Chronic stress is a different matter entirely.

When stress hormones remain elevated for weeks, months, or years, they begin to alter the very structure of the brain. The most well-documented changes occur in three regions: the prefrontal cortex, the hippocampus, and the amygdala. The prefrontal cortex, responsible for executive function and emotional regulation, tends to shrink. The hippocampus, central to memory, also shows reduced volume. The amygdala — the brain's threat-detection center — actually grows larger and more reactive.

These changes are not merely academic. A person whose amygdala has become hyperactive while their prefrontal cortex has weakened will experience the world as more threatening and have fewer cognitive resources to manage that perception. Small inconveniences feel like crises. Setbacks feel catastrophic. The brain has, in a sense, been retrained to expect danger.

Importantly, these changes are not permanent. Research on neuroplasticity shows that the brain retains the capacity for structural change throughout life. Interventions that reliably reduce stress — including regular exercise, mindfulness meditation, adequate sleep, and certain forms of psychotherapy — have been shown to partially reverse stress-induced brain changes. In some studies, hippocampal volume has measurably increased after just eight weeks of mindfulness training.

The implication is significant: chronic stress is not just an unpleasant emotional state but a biological process with measurable physical consequences. Recognizing it as such may change how individuals, employers, and healthcare systems approach prevention and treatment. The next question becomes practical: what specific strategies are most effective at protecting and restoring the stressed brain?`,

    source: "The Atlantic",
    passage: `Social media platforms are designed to maximize engagement, and one of the most reliable ways to capture attention is to invite comparison. Every scroll through a curated feed presents users with carefully selected glimpses of other people's lives — vacations, achievements, relationships, bodies — almost always edited to appear better than ordinary reality. The cumulative psychological effect of this exposure has become a major area of research over the past decade.

    title: "How Early Bonds Shape Adult Relationships",
    source: "Psychology Today",
    passage: `The relationships we form as adults — with romantic partners, friends, even colleagues — are shaped to a surprising degree by the bonds we formed in the first few years of life. This insight, which originated with British psychiatrist John Bowlby in the mid-twentieth century, has become one of the most influential frameworks in modern developmental psychology.

Bowlby argued that infants are biologically predisposed to seek proximity to a primary caregiver, typically the mother. The quality of this early bond, he proposed, creates an internal working model — a mental template for what relationships are like. Children who experience consistent, responsive caregiving develop a model that says: others are reliable, I am worthy of care, and the world is a reasonably safe place. Children whose caregivers are absent, inconsistent, or rejecting develop different models, with corresponding patterns of expectation and behavior.

Mary Ainsworth, a colleague of Bowlby, designed the famous Strange Situation experiment to classify these patterns. In a brief laboratory procedure, she observed how toddlers responded to being briefly separated from and reunited with their mothers. She identified three primary attachment styles: secure, anxious-ambivalent, and avoidant. A fourth, disorganized, was added by later researchers. Roughly 60 percent of children in low-risk samples showed secure attachment, with the others distributed among the insecure categories.

What makes attachment theory particularly powerful is its predictive reach. Longitudinal studies have followed children classified in infancy into adulthood, finding that early attachment style correlates — though imperfectly — with adult outcomes ranging from romantic relationship quality to workplace functioning. Securely attached children tend to become adults who are comfortable with both intimacy and independence; insecurely attached children show various patterns of difficulty in close relationships.

    title: "The Brain That Rewires Itself",
    source: "Scientific American Mind",
    passage: `For most of the twentieth century, neuroscientists believed that the adult brain was essentially fixed. Once a person had passed through childhood's critical periods, the wiring was set, and the only direction left was decline. This view has been overturned in the last few decades by mounting evidence of neuroplasticity — the brain's lifelong capacity to reorganize itself in response to experience.

The most dramatic demonstrations come from studies of recovery after injury. When a stroke damages a region of the brain that controls hand movement, surrounding regions can sometimes take over the lost function, particularly when the patient engages in intensive rehabilitation. The brain effectively rewires the route by which a signal travels from intention to muscle. Similarly, in people who lose their sight, the visual cortex does not simply fall silent; it begins processing information from other senses, contributing to the heightened auditory and tactile abilities often observed in blind individuals.

But neuroplasticity is not limited to recovery from damage. It is the basis of all learning. When a violinist practices, the brain regions controlling her left-hand fingers literally expand. When a London taxi driver memorizes the city's streets, his hippocampus grows. Every new skill, every memorized fact, every emotional habit leaves a physical trace in neural tissue.

This capacity, however, is not infinite or unconditional. Plasticity tends to favor what we practice and neglects what we don't. The brain optimizes for our actual habits, not our intended ones. A person who spends hours each day scrolling through social media is, neurologically speaking, training that pattern. A person who practices an instrument or a language is training a different one. In both cases, the brain becomes more efficient at whatever is repeatedly demanded of it.

This insight has profound implications for how we structure our days, our work, and our recovery from setbacks. The next question is how we can deliberately shape this process to our advantage.`,

    title: "The Quiet Power of Reappraisal",
    source: "APA Monitor",
    passage: `When something upsetting happens, most of us reach instinctively for the easiest way to feel better: avoid the situation, distract ourselves, or push the feeling down. These strategies often provide short-term relief, but research over the past two decades has identified a different approach that yields more durable benefits — cognitive reappraisal, the practice of reinterpreting an emotional situation to change its meaning.

Reappraisal does not deny what happened. A person stuck in traffic who reappraises is not pretending to be unbothered; instead, they might consciously frame the delay as a chance to listen to a podcast, or as a small inconvenience compared with truly serious problems. The situation is unchanged; what changes is the cognitive interpretation imposed on it. And because emotions arise largely from interpretations, the emotional response shifts accordingly.

The contrast with suppression — pushing emotions down without examining them — is striking. Suppression produces a temporary appearance of calm but tends to backfire over time. Suppressors report higher levels of negative emotion, weaker social relationships, and even elevated cardiovascular activity compared with reappraisers. The act of bottling up feelings is metabolically and psychologically costly.

Reappraisal, by contrast, has been linked to reduced depression and anxiety symptoms, better academic and workplace performance, and stronger interpersonal relationships. Brain imaging studies show that when people reappraise, activity in the prefrontal cortex increases while activity in the amygdala — the threat-detection center — decreases. The strategy literally engages the brain's executive system to dampen its alarm system.

This is not to suggest that reappraisal is always appropriate. Some situations call for direct action; some emotions need to be felt and processed rather than reinterpreted. But for the everyday frustrations and disappointments that fill ordinary life, reappraisal is among the most evidence-supported tools available. The natural follow-up question is how to develop this skill, since it does not come automatically to most people.`,

function seededShuffle(array, seed) {
  // Mulberry32 PRNG
  let s = seed >>> 0;
  const next = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(next() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getDateSeed(d = new Date()) {
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function getTodaysBatch(articles, count = 5) {
  const seed = getDateSeed();
  return seededShuffle(articles, seed).slice(0, count);
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

    const updated = {
      ...completedAllTime,
      [tKey]: [...new Set([...(completedAllTime[tKey] || []), articleId])],
    };
    setCompletedAllTime(updated);
    setCompletedToday(updated[tKey]);
    try {
      await storage.set(COMPLETED_KEY, JSON.stringify(updated));
    } catch (e) {}
  };

  const answered = answers.filter((a) => a !== null).length;
  const score = useMemo(() => {
    if (!currentArticle) return 0;
    return currentArticle.questions.reduce(
      (acc, q, i) => acc + (answers[i] === q.answer ? 1 : 0),
      0
    );
  }, [answers, currentArticle]);

  const startArticle = (article) => {
    setCurrentArticle(article);
    setAnswers(Array(5).fill(null));
    setPhase("quiz");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const pick = (qIdx, letter) => {
    if (phase === "result") return;
    setAnswers((prev) => {
      const next = [...prev];
      next[qIdx] = letter;
      return next;
    });
  };

  const submit = () => {
    if (answered < 5) return;
    setPhase("result");
    if (currentArticle) persistCompletion(currentArticle.id);
  };

  const reset = () => {
    setPhase("select");
    setCurrentArticle(null);
    setAnswers(Array(5).fill(null));
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const nextInBatch = () => {
    const remaining = todaysBatch.filter(
      (a) => !completedToday.includes(a.id) && a.id !== currentArticle?.id
    );
    if (remaining.length > 0) {
      startArticle(remaining[0]);
    } else {
      reset();
    }
  };

  // ─── Styles ──────────────────────────────────────────────────────────────

  const S = {
    root: {
      minHeight: "100vh",
      background: C.bg,
      color: C.textBody,
      fontFamily: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
      padding: "20px 14px 60px",
    },
    wrap: { maxWidth: 720, margin: "0 auto" },
    topBar: {
      display: "flex",
      alignItems: "baseline",
      gap: 10,
      flexWrap: "wrap",
      marginBottom: 18,
      paddingBottom: 16,
      borderBottom: `1px solid ${C.border}`,
    },
    logo: {
      fontSize: 14,
      fontWeight: 700,
      letterSpacing: "0.12em",
      color: C.accent,
      textTransform: "uppercase",
    },
    logoSub: { fontSize: 12, color: C.textMuted, letterSpacing: "0.03em" },
    todayHeader: {
      display: "flex",
      justifyContent: "space-between",
      alignItems: "baseline",
      marginBottom: 14,
      flexWrap: "wrap",
      gap: 8,
    },
    todayTitle: { fontSize: 18, fontWeight: 700, color: C.textPrimary },
    todayProgress: {
      fontSize: 12,
      color: C.textSecondary,
      letterSpacing: "0.03em",
    },
    card: {
      background: C.cardBg,
      border: `1px solid ${C.border}`,
      borderRadius: 12,
      padding: "18px",
      marginBottom: 16,
    },
    sectionTitle: {
      fontSize: 11,
      fontWeight: 700,
      letterSpacing: "0.18em",
      color: C.textMuted,
      textTransform: "uppercase",
      marginBottom: 12,
      marginTop: 8,
    },
    listItem: (done, isToday) => ({
      padding: "14px 16px",
      background: isToday ? C.accentBg : C.cardBg,
      border: `1px solid ${isToday ? C.accentBorder : C.border}`,
      borderRadius: 10,
      marginBottom: 8,
      cursor: "pointer",
      transition: "all 0.12s",
      opacity: done ? 0.55 : 1,
      minHeight: 44,
    }),
    listTopic: {
      fontSize: 10,
      color: C.accent,
      letterSpacing: "0.1em",
      marginBottom: 4,
      fontWeight: 700,
      textTransform: "uppercase",
    },
    listTitle: {
      fontSize: 14,
      color: C.textPrimary,
      lineHeight: 1.4,
      fontWeight: 500,
    },
    listMeta: {
      fontSize: 11,
      color: C.textMuted,
      marginTop: 4,
    },
    completeBanner: {
      padding: "16px 18px",
      background: C.successBg,
      border: `1px solid ${C.successBorder}`,
      borderRadius: 10,
      marginBottom: 16,
      color: C.success,
      fontSize: 13,
      fontWeight: 600,
      lineHeight: 1.6,
    },
    articleMeta: {
      fontSize: 11,
      color: C.textMuted,
      letterSpacing: "0.06em",
      marginBottom: 8,
      textTransform: "uppercase",
    },
    articleTitle: {
      fontSize: 22,
      fontWeight: 700,
      color: C.textPrimary,
      marginBottom: 18,
      lineHeight: 1.3,
      fontFamily: "Georgia, 'Times New Roman', serif",
    },
    passage: {
      fontSize: 16,
      lineHeight: 1.85,
      color: C.textBody,
      whiteSpace: "pre-wrap",
      fontFamily: "Georgia, 'Times New Roman', serif",
    },
    qNum: {
      fontSize: 11,
      color: C.textMuted,
      marginBottom: 6,
      letterSpacing: "0.05em",
    },
    qText: {
      fontSize: 15,
      lineHeight: 1.65,
      marginBottom: 14,
      color: C.textPrimary,
      fontWeight: 500,
    },
    explanation: {
      marginTop: 14,
      padding: "12px 14px",
      background: C.bg,
      borderRadius: 8,
      borderLeft: `3px solid ${C.accent}`,
      fontSize: 13,
      lineHeight: 1.75,
      color: C.textBody,
    },
    tipBox: {
      marginTop: 10,
      padding: "10px 14px",
      background: C.accentBg,
      borderRadius: 8,
      borderLeft: `3px solid ${C.accent}`,
      fontSize: 12,
      color: C.accent,
      lineHeight: 1.65,
      fontWeight: 500,
    },
    scoreBox: {
      textAlign: "center",
      padding: "26px 22px",
      background: C.cardBg,
      border: `1px solid ${C.border}`,
      borderRadius: 12,
      marginBottom: 18,
    },
    scoreBig: {
      fontSize: 48,
      fontWeight: 700,
      color: C.accent,
      lineHeight: 1,
      fontFamily: "Georgia, serif",
    },
    scoreSub: { fontSize: 13, color: C.textSecondary, marginTop: 8 },
    progressBar: {
      width: "100%",
      height: 4,
      background: C.border,
      borderRadius: 2,
      marginBottom: 20,
      overflow: "hidden",
    },
  };

  const primaryBtn = (disabled) => ({
    width: "100%",
    padding: "14px",
    borderRadius: 10,
    border: "none",
    background: disabled ? C.border : C.accent,
    color: disabled ? C.textMuted : "#fff",
    cursor: disabled ? "not-allowed" : "pointer",
    fontSize: 14,
    fontWeight: 700,
    fontFamily: "inherit",
    letterSpacing: "0.03em",
    minHeight: 48,
    transition: "all 0.12s",
  });

  const secondaryBtn = {
    width: "100%",
    padding: "13px",
    borderRadius: 10,
    border: `1px solid ${C.accent}`,
    background: "transparent",
    color: C.accent,
    cursor: "pointer",
    fontSize: 14,
    fontWeight: 700,
    fontFamily: "inherit",
    letterSpacing: "0.03em",
    minHeight: 48,
    marginTop: 8,
  };

  const qWrapStyle = (status) => ({
    background:
      status === "correct" ? C.successBg : status === "wrong" ? C.errorBg : C.cardBg,
    border: `1px solid ${
      status === "correct" ? C.successBorder : status === "wrong" ? C.errorBorder : C.border
    }`,
    borderRadius: 12,
    padding: "18px",
    marginBottom: 14,
  });

  const typeTagStyle = (danger) => ({
    display: "inline-block",
    padding: "3px 9px",
    borderRadius: 5,
    fontSize: 10,
    fontWeight: 700,
    letterSpacing: "0.1em",
    background: danger ? C.dangerBg : C.accentBg,
    color: danger ? C.danger : C.accent,
    marginBottom: 12,
    border: `1px solid ${danger ? C.dangerBorder : C.accentBorder}`,
    textTransform: "uppercase",
  });

  const optStyle = (sel, showRes, isAns) => {
    let bg = C.cardBg, border = C.border, color = C.textBody;
    if (showRes && isAns) {
      bg = C.successBg; border = C.successBorder; color = C.success;
    } else if (showRes && sel && !isAns) {
      bg = C.errorBg; border = C.errorBorder; color = C.errorText;
    } else if (sel) {
      bg = C.accentBg; border = C.accentBorder; color = C.accent;
    }
    return {
      display: "block",
      width: "100%",
      padding: "12px 14px",
      marginBottom: 8,
      borderRadius: 9,
      border: `1px solid ${border}`,
      background: bg,
      color,
      cursor: showRes ? "default" : "pointer",
      textAlign: "left",
      fontSize: 14,
      fontFamily: "inherit",
      lineHeight: 1.5,
      transition: "all 0.1s",
      minHeight: 44,
      fontWeight: sel || (showRes && isAns) ? 600 : 400,
    };
  };

  // ─── Render ──────────────────────────────────────────────────────────────

  const allTodayDone = todaysBatch.every((a) => completedToday.includes(a.id));
  const otherArticles = ARTICLES.filter(
    (a) => !todaysBatch.some((t) => t.id === a.id)
  );

  return (
    <div style={S.root}>
      <div style={S.wrap}>
        <div style={S.topBar}>
          <span style={S.logo}>ReadLab</span>
          <span style={S.logoSub}>· 心理學英文閱讀練習</span>
        </div>

        {phase === "select" && (
          <>
            <div style={S.todayHeader}>
              <div style={S.todayTitle}>📅 今日 5 篇</div>
              <div style={S.todayProgress}>
                {completedToday.filter(id => todaysBatch.some(a => a.id === id)).length} / 5
              </div>
            </div>

            {allTodayDone && (
              <div style={S.completeBanner}>
                ✓ 今日 5 篇都完成了！明天會自動換新的，也可以練下面的其他文章
              </div>
            )}

            <div style={S.card}>
              {todaysBatch.map((a) => {
                const done = completedToday.includes(a.id);
                return (
                  <div
                    key={a.id}
                    style={S.listItem(done, true)}
                    onClick={() => startArticle(a)}
                  >
                    <div style={S.listTopic}>{a.topic}</div>
                    <div style={S.listTitle}>{a.title}</div>
                    {done && <div style={S.listMeta}>✓ 已完成</div>}
                  </div>
                );
              })}
            </div>

            {otherArticles.length > 0 && (
              <>
                <div style={S.sectionTitle}>其他文章 ({otherArticles.length})</div>
                <div style={S.card}>
                  {otherArticles.map((a) => {
                    const done = completedToday.includes(a.id);
                    return (
                      <div
                        key={a.id}
                        style={S.listItem(done, false)}
                        onClick={() => startArticle(a)}
                      >
                        <div style={S.listTopic}>{a.topic}</div>
                        <div style={S.listTitle}>{a.title}</div>
                        {done && <div style={S.listMeta}>✓ 已完成</div>}
                      </div>
                    );
                  })}
                </div>
              </>
            )}

            <div
              style={{
                fontSize: 12,
                color: C.textMuted,
                marginTop: 16,
                lineHeight: 1.7,
                textAlign: "center",
              }}
            >
              每篇 5 題：主旨題 / 詞彙題 / 細節題 / 推論題 / 預測題
            </div>
          </>
        )}

        {(phase === "quiz" || phase === "result") && currentArticle && (
          <>
            {phase === "quiz" && (
              <div style={S.progressBar}>
                <div
                  style={{
                    width: `${(answered / 5) * 100}%`,
                    height: "100%",
                    background: C.accent,
                    transition: "width 0.3s",
                  }}
                />
              </div>
            )}

            <div style={S.card}>
              <div style={S.articleMeta}>
                {currentArticle.source} · {currentArticle.topic}
              </div>
              <div style={S.articleTitle}>{currentArticle.title}</div>
              <div style={S.passage}>{currentArticle.passage}</div>
            </div>

            {phase === "result" && (
              <div style={S.scoreBox}>
                <div style={S.scoreBig}>{score} / 5</div>
                <div style={S.scoreSub}>
                  {score === 5 ? "完美！全部答對" : score >= 4 ? "很好，只差一步" : score >= 3 ? "還不錯，繼續練" : "多練幾篇就會進步"}
                </div>
              </div>
            )}

            {currentArticle.questions.map((q, i) => {
              const sel = answers[i];
              const showRes = phase === "result";
              const correct = sel === q.answer;
              const isDanger = DANGER_TYPES.includes(q.type);
              const status = showRes ? (correct ? "correct" : "wrong") : "neutral";

              return (
                <div key={i} style={qWrapStyle(status)}>
                  <span style={typeTagStyle(isDanger)}>
                    {isDanger ? "⚠ " : ""}{q.type}
                  </span>
                  <div style={S.qNum}>Q{i + 1}</div>
                  <div style={S.qText}>{q.question}</div>

                  {q.options.map((opt, j) => {
                    const letter = ["A", "B", "C", "D"][j];
                    return (
                      <button
                        key={j}
                        onClick={() => pick(i, letter)}
                        style={optStyle(sel === letter, showRes, q.answer === letter)}
                      >
                        {opt}
                      </button>
                    );
                  })}

                  {showRes && (
                    <div style={S.explanation}>
                      <span style={{ color: C.accent, fontWeight: 700 }}>解析 </span>
                      {q.explanation}
                    </div>
                  )}

                  {showRes && isDanger && !correct && (
                    <div style={S.tipBox}>💡 {DANGER_TIPS[q.type]}</div>
                  )}
                </div>
              );
            })}

            {phase === "quiz" && (
              <button
                style={primaryBtn(answered < 5)}
                disabled={answered < 5}
                onClick={submit}
              >
                {answered < 5 ? `還有 ${5 - answered} 題未作答` : "交卷 →"}
              </button>
            )}

            {phase === "result" && (
              <>
                {todaysBatch.some(a => a.id === currentArticle.id) &&
                 todaysBatch.some(a => !completedToday.includes(a.id) && a.id !== currentArticle.id) && (
                  <button style={primaryBtn(false)} onClick={nextInBatch}>
                    今日下一篇 →
                  </button>
                )}
                <button style={secondaryBtn} onClick={reset}>
                  ← 回到文章列表
                </button>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
